events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # HTTP服务器 - 重定向到HTTPS
    server {
        listen 80;
        server_name _;
        
        # 允许Let's Encrypt验证
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # 其他请求重定向到HTTPS（如果配置了SSL）
        # 如果暂时不使用HTTPS，可以注释掉下面的重定向
